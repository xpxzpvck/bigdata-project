services:
  ingestion:
    build: 
      context: ../ingestion
      dockerfile: Dockerfile
    environment:
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPIC=raw-page-creates
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
    restart: always

  api:
    build: 
      context: ../api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_started
      cassandra:
        condition: service_healthy
    restart: always