services:
  spark-master:
    image: spark:3.5.8-python3
    profiles: ["analytics"]
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ../spark_jobs:/app

  spark-worker:
    image: spark:3.5.8-python3
    profiles: ["analytics"]
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --webui-port
      - "8081"
      - --cores
      - "2"
      - --memory
      - 2G
    ports:
      - "8081:8081"
    depends_on:
      - spark-master
    volumes:
      - ../spark_jobs:/app

  streaming-jobs:
    image: spark:3.5.8-python3
    profiles: ["analytics"]
    depends_on:
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
      cassandra:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
    volumes:
      - ../spark_jobs:/app
    command: bash /app/run_streams.sh

batch-scheduler:
  image: spark:3.5.8-python3
  profiles: ["analytics"]
  depends_on:
    spark-master:
      condition: service_started
    spark-worker:
      condition: service_started
    minio:
      condition: service_healthy
    cassandra:
      condition: service_healthy
  volumes:
    - ../spark_jobs:/app
  command: bash -c "pip install schedule && python /app/scheduler.py"
  restart: always